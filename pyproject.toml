[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acds-detr"
version = "0.2.0"
description = "ACDS-DETR for dense cross-scale crater detection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = [
  "torch>=2.0.0",
  "torchvision>=0.15.0",
  "numpy>=1.22.2",
  "opencv-python>=4.6.0",
  "pillow>=9.0.0",
  "pyyaml>=6.0",
  "requests>=2.28.0",
  "scipy>=1.9.0",
  "tqdm>=4.64.0",
  "matplotlib>=3.6.0",
  "pandas>=1.5.0",
  "seaborn>=0.12.0",
  "psutil>=5.9.0",
  "py-cpuinfo>=9.0.0",
  "thop>=0.1.1",
  "dill>=0.3.8",
  "pycocotools>=2.0.6",
  "einops>=0.6.0",
  "timm>=0.9.8",
]

[tool.setuptools.packages.find]
include = ["ultralytics*"]

[tool.setuptools.package-data]
ultralytics = ["cfg/*.yaml", "cfg/**/*.yaml", "assets/*"]
